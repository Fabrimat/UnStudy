services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: summarize
      POSTGRES_PASSWORD: summarize
      POSTGRES_DB: summarize
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U summarize"]
      interval: 2s
      retries: 30
  s3:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: summarize
      RUSTFS_SECRET_KEY: summarize-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [s3data:/data]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      retries: 30
  s3-init:
    image: amazon/aws-cli:latest
    depends_on: [s3]
    environment:
      AWS_ACCESS_KEY_ID: summarize
      AWS_SECRET_ACCESS_KEY: summarize-secret
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - ./docker/s3-cors.json:/cors.json:ro
    entrypoint: >
      sh -c "until aws --endpoint-url http://s3:9000 s3api list-buckets >/dev/null 2>&1; do
               echo waiting for s3...; sleep 1;
             done &&
             for b in summarize summarize-test; do
               aws --endpoint-url http://s3:9000 s3api create-bucket --bucket $$b >/dev/null 2>&1 || true;
               aws --endpoint-url http://s3:9000 s3api put-bucket-cors --bucket $$b --cors-configuration file:///cors.json;
             done"
  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]
volumes:
  pgdata:
  s3data:
