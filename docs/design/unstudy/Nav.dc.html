<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Navigation</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700&display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
.tabs{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:5;background:#fff;border-top:1px solid #DDD4E4;padding:0 4px env(safe-area-inset-bottom)}
.rail{display:none;position:fixed;left:0;top:0;bottom:0;width:88px;z-index:5;background:#fff;border-right:1px solid #DDD4E4;box-sizing:border-box;padding:20px 8px;flex-direction:column;align-items:stretch;gap:6px}
.tab{flex:1 1 0;min-width:0;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:500;position:relative}
.rt{min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:500;border-radius:14px}
.rt:hover{background:#EAE3F0}
@media(min-width:640px){.tabs{display:none}.rail{display:flex}}
@media(min-width:1180px){.rail{display:none}}
</style>
</helmet>
<div style="font-family: 'Figtree', 'Segoe UI', system-ui, sans-serif">
  <nav class="tabs" aria-label="Main">
    <sc-for list="{{items}}" as="i" hint-placeholder-count="5">
      <a class="tab" href="{{i.href}}" style="{{i.tabStyle}}">
        <span style="position: absolute; top: -1px; height: 3px; width: 28px; border-radius: 0 0 3px 3px; {{i.bar}}"></span>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{i.d}}"/></svg>
        {{i.label}}
      </a>
    </sc-for>
  </nav>
  <nav class="rail" aria-label="Main">
    <a href="Main.dc.html" aria-label="UnStudy home" style="display: flex; justify-content: center; padding-bottom: 16px"><svg width="36" height="36" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#24173A"/><path d="M10.500 7v10a5.500 5.500 0 0 0 11 0" fill="none" stroke="#fff" stroke-width="3.600" stroke-linecap="round"/><circle cx="21.500" cy="8" r="2.400" fill="{{accent}}"/></svg></a>
    <sc-for list="{{items}}" as="i" hint-placeholder-count="5">
      <a class="rt" href="{{i.href}}" style="{{i.railStyle}}">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{i.d}}"/></svg>
        {{i.label}}
      </a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","default":"home","options":["home","docs","summaries","credits","settings"]},"accent":{"editor":"color","default":"#C93C20"},"$preview":{"width":390,"height":200}}'>
class Component extends DCLogic {
renderVals() {
  const active = this.props.active ?? 'home';
  const accent = this.props.accent ?? '#C93C20';
  const defs = [
    ['home', 'Home', 'Main.dc.html', 'M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z'],
    ['docs', 'Docs', 'Main.dc.html', 'M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z M14 3v5h5'],
    ['summaries', 'Summaries', 'Summary.dc.html', 'M4 6h16 M4 12h16 M4 18h10'],
    ['credits', 'Credits', 'Main.dc.html', 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z M12 7v10 M9.5 9.5h4a1.5 1.5 0 0 1 0 3h-3a1.5 1.5 0 0 0 0 3h4'],
    ['settings', 'Settings', 'Main.dc.html', 'M4 7h10 M18 7h2 M4 17h2 M10 17h10 M14 5v4 M6 15v4']
  ];
  return {
    accent,
    items: defs.map(([id, label, href, d]) => {
      const on = id === active;
      return {
        label, href, d,
        tabStyle: on ? 'color:#24173A;font-weight:700' : 'color:#6A5F78',
        bar: on ? 'background:' + accent : 'background:transparent',
        railStyle: on ? 'background:#24173A;color:#fff' : 'color:#6A5F78'
      };
    })
  };
}
}
</script>
</body>
</html>
